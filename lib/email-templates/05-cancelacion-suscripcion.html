<!DOCTYPE html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<title>{{title}}</title>
<!--[if mso]><style>body,table,td,a{font-family:Arial,Helvetica,sans-serif !important}</style><![endif]-->
</head>
<body style="margin:0;padding:0;background:#EFEAE5;-webkit-text-size-adjust:100%">
<div style="display:none;font-size:1px;color:#EFEAE5;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EFEAE5">
<tr><td align="center" style="padding:32px 12px">
<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:640px;max-width:640px;background:#ffffff;border:1px solid #E4DCD4;border-radius:16px;overflow:hidden">
  <tr><td style="background:#F05324;padding:22px 40px">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="padding-right:12px"><img src="https://www.gastrometrics.org/email/gm-mono-blanco.png" width="26" height="26" alt="" style="display:block;border:0" /></td>
      <td style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:800;color:#ffffff;letter-spacing:-0.03em">Gastrometrics</td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:38px 40px 34px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif">
    <h1 style="margin:0 0 20px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-0.025em;color:#1A1512">{{heading}}</h1>    <p style="margin:0 0 20px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.62;color:#4A423C">{{body}}</p>    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F7F4F1;border-radius:10px;margin:0 0 20px"><tr><td style="padding:18px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;color:#6E635C;padding-bottom:12px">{{labelAccessUntil}}</td><td align="right" style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:700;color:#1A1512;padding-bottom:12px">{{accessUntil}}</td></tr>
        <tr><td colspan="2" style="height:1px;background:#E4DCD4;font-size:0;line-height:0">&nbsp;</td></tr>
        <tr><td style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;color:#6E635C;padding:12px 0">{{labelThen}}</td><td align="right" style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:700;color:#1A1512;padding:12px 0">{{valueThen}}</td></tr>
        <tr><td colspan="2" style="height:1px;background:#E4DCD4;font-size:0;line-height:0">&nbsp;</td></tr>
        <tr><td style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;color:#6E635C;padding-top:12px">{{labelNextCharge}}</td><td align="right" style="font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:700;color:#1A1512;padding-top:12px">{{valueNone}}</td></tr>
      </table>
    </td></tr></table>    <p style="margin:0 0 20px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.62;color:#4A423C">{{body2}}</p>    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px"><tr>
      <td align="center" bgcolor="#F05324" style="border-radius:8px"><a href="{{billingPortalUrl}}" style="display:inline-block;padding:14px 26px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px">{{cta}}</a></td>
    </tr></table>    <p style="margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#8A7D74">{{footnote}}</p>
  </td></tr>
  <tr><td style="border-top:1px solid #EDE6E0;background:#FBF9F7;padding:20px 40px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.55;color:#8A7D74">
    {{footerAddress}}<br />
    {{footer2}}
  </td></tr>
</table>
</td></tr></table>
</body>
</html>
